[project]
name = "nerf-implementation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clearml>=2.1.10",
    "huggingface-hub>=1.24.0",
    "ipykernel>=7.3.0",
    "kagglehub>=1.0.2",
    "lightning>=2.6.5",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "piqa>=1.3.2",
    "shapely>=2.1.2",
    "tensorboard>=2.21.0",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "tqdm>=4.68.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nerf"]
